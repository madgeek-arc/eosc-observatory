# Example overrides for running the EOSC Observatory backend. Copy outside the repository (for
# example application-local.properties), fill the placeholders and start with
#   --spring.config.additional-location=file:./application-local.properties
# Never commit real credentials.

fqdn=localhost
# Remove mail-debug to deliver real emails
spring.profiles.active=mail-debug

observatory.admins=<admin-email-1>,<admin-email-2>
observatory.base-url=http://localhost:4200
observatory.login-redirect=http://localhost:4200
observatory.logout-redirect=http://localhost:4200
# openssl rand -base64 32
observatory.invitationKey=<base64-256-bit-key>
observatory.hmacSecret=<random-secret>
# Only when the frontend is served from another origin
#observatory.corsAllowedOrigins=http://localhost:4200
observatory.surveySchedulerCron=-

# OIDC client registration (example registration id "oidc")
spring.security.oauth2.client.registration.oidc.client-id=<client-id>
spring.security.oauth2.client.registration.oidc.client-secret=<client-secret>
spring.security.oauth2.client.registration.oidc.scope=openid,email,profile
spring.security.oauth2.client.provider.oidc.issuer-uri=https://<idp-host>/<realm-or-path>

# PostgreSQL
registry.datasource.username=<db-user>
registry.datasource.password=<db-password>
authorization.datasource.username=<db-user>
authorization.datasource.password=<db-password>
commenting.datasource.username=<db-user>
commenting.datasource.password=<db-password>
datasets.datasource.username=<db-user>
datasets.datasource.password=<db-password>
erasure.datasource.username=<db-user>
erasure.datasource.password=<db-password>

# Elasticsearch and Redis
registry.elasticsearch.uris=http://localhost:9200
registry.elasticsearch.username=<elastic-user>
registry.elasticsearch.password=<elastic-password>
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=<redis-password>

# Integrations
mailer.client.host=http://localhost:8080/mailer
mailer.from=<sender-address>
#mailer.client.api-key=<mailer-api-key>
messaging-system.client.endpoint=http://localhost:8383/api/
#messaging-system.client.api-key=<messaging-api-key>
stats-tool.endpoint=<stats-tool-base-url>
analytics.url=<matomo-base-url>
analytics.token=<matomo-token>
spring.ai.openai.api-key=<openai-api-key>
google.recaptcha.secret=<recaptcha-secret>
ws.allowedOriginPattern=http://localhost:4200
sentry.dsn=
